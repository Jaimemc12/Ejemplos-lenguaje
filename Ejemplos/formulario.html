<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulario de contacto</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
    <body>
        <div class="contenedor">
            <h1>Formulario de contacto</h1>
            <form action="#" method="post" enctype="multipart/form-data">
            <fieldset>
                <legend>Datos de contacto</legend>
                <p>
                <label for="nombre">Nombre:*</label>
                <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required>
                </p>
                <p>
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password">
                </p>
                <p>
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email">
                </p>
                <p>
                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono">
                </p>
                <p>
                <label for="web">Página web:</label>
                <input type="url" id="web" name="web">
                </p>
                <p>
                <label for="buscar">Buscar:</label>
                <input type="search" id="buscar" name="buscar">
                </p>
            </fieldset>

            <fieldset>
                <legend>Fechas y horas</legend>
                <p>
                <label for="fecha">Fecha:</label>
                <input type="date" id="fecha" name="fecha">
                </p>
                <p>
                <label for="hora">Hora:</label>
                <input type="time" id="hora" name="hora">
                </p>
                <p>
                <label for="fechahora">Fecha y hora:</label>
                <input type="datetime-local" id="fechahora" name="fechahora">
                </p>
                <p>
                <label for="mes">Mes:</label>
                <input type="month" id="mes" name="mes">
                </p>
                <p>
                <label for="semana">Semana:</label>
                <input type="week" id="semana" name="semana">
                </p>
            </fieldset>

            <fieldset>
                <legend>Valores numéricos</legend>
                <p>
                <label for="edad">Edad:</label>
                <input type="number" id="edad" name="edad" min="0" max="120">
                </p>
                <p>
                <label for="nivel">Nivel:</label>
                <input type="range" id="nivel" name="nivel" min="0" max="100" value="50">
                </p>
                <p>
                <label for="color">Color favorito:</label>
                <input type="color" id="color" name="color" value="#000000">
                </p>
            </fieldset>

            <fieldset class="opciones">
                <legend>Opciones</legend>
                <p>Seleccione una opción:</p>
                <p>
                <label><input type="radio" name="opcion" value="1"> Opción 1</label>
                <label><input type="radio" name="opcion" value="2"> Opción 2</label>
                <label><input type="radio" name="opcion" value="3"> Opción 3</label>
                </p>
                <p>Seleccione sus aficiones:</p>
                <p>
                <label><input type="checkbox" name="aficiones" value="deporte"> Deporte</label>
                <label><input type="checkbox" name="aficiones" value="musica"> Música</label>
                <label><input type="checkbox" name="aficiones" value="informatica"> Informática</label>
                </p>
            </fieldset>

            <fieldset>
                <legend>Listas</legend>
                <p>
                <label for="provincia">Provincia:</label>
                <select id="provincia" name="provincia">
                    <option value="">Selecciona una provincia</option>
                    <option>Albacete</option>
                    <option>Ciudad Real</option>
                    <option>Cuenca</option>
                    <option>Guadalajara</option>
                    <option>Toledo</option>
                </select>
                </p>
                <p>
                <label for="estudios">Estudios:</label>
                <select id="estudios" name="estudios">
                    <option selected>DAM</option>
                    <option>DAW</option>
                    <option>ASIR</option>
                </select>
                </p>
                <p>
                <label for="lenguajes">Lenguajes favoritos:</label>
                <select id="lenguajes" name="lenguajes" multiple size="4">
                    <option>HTML</option>
                    <option>CSS</option>
                    <option>JavaScript</option>
                    <option>Java</option>
                </select>
                </p>
            </fieldset>

            <fieldset>
                <legend>Texto</legend>
                <p>
                <label for="comentarios">Comentarios:</label><br>
                <textarea id="comentarios" name="comentarios" rows="5"></textarea>
                </p>
            </fieldset>

            <fieldset>
                <legend>Otros elementos</legend>
                <p>
                <label for="archivo">Seleccione un archivo:</label>
                <input type="file" id="archivo" name="archivo">
                </p>
                <p>
                <label for="navegador">Navegador favorito:</label>
                <input list="navegadores" id="navegador" name="navegador">
                <datalist id="navegadores">
                    <option value="Chrome">
                    <option value="Firefox">
                    <option value="Edge">
                    <option value="Safari">
                    <option value="Opera">
                </datalist>
                </p>
            </fieldset>

            <fieldset>
                <legend>Botones</legend>
                <p>
                <button type="submit">Enviar formulario</button>
                <button type="reset">Limpiar formulario</button>
                </p>
            </fieldset>
            </form>
        </div>
    </body>
</html>
